[project]
name = "sanctions-lists-etl"
version = "0.1.0"
description = "ETL pipeline for public sanctions lists (OFAC SDN + Non-SDN, EU FSF, UN Security Council, UK Sanctions List) and INTERPOL UN Special Notices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
sanctions-etl = "sanctions_lists_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_lists_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
