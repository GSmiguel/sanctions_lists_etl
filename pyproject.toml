[project]
name = "sanctions-lists-etl"
version = "0.1.0"
description = "ETL pipeline for public sanctions lists (stage 1: OFAC SDN)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
sanctions-etl = "sanctions_lists_etl.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_lists_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
