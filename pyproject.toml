[project]
name = "sanctions-lists-etl"
version = "0.1.0"
description = "ETL pipeline for public sanctions lists (OFAC SDN + Non-SDN, EU FSF, UN Security Council, UK Sanctions List)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only needed for `--bigquery`; the default `uv sync` stays lightweight.
bigquery = ["google-cloud-bigquery>=3.25,<4"]

[project.scripts]
sanctions-etl = "sanctions_lists_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_lists_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The package deliberately binds `log = logging.getLogger(__name__)` just below the
# stdlib imports and above the local ones; keep that idiom rather than churn every module.
ignore = ["E402"]
