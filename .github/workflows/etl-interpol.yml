name: etl-interpol

# INTERPOL UN Special Notices only. Kept off the daily job because the crawl
# makes a few hundred requests over ~5 min and the edge (Akamai) rate-limits
# heavy clients with HTTP 403 — a shared runner IP can get blocked for a while.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"  # 05:23 UTC every Monday

permissions:
  contents: read

concurrency:
  group: etl-interpol
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --no-dev
      - name: Crawl INTERPOL UN Special Notices
        env:
          INTERPOL_REQUEST_DELAY: "1.5"
        run: uv run sanctions-etl interpol
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interpol-notices
          path: |
            data/output/interpol.xlsx
            data/raw/interpol.json.meta.json
          retention-days: 45
          if-no-files-found: warn
